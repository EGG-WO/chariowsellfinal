<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StreamFlow — TV en Direct</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    *{margin:0;padding:0;box-sizing:border-box;}

    body{
      font-family:'Outfit',sans-serif;
      background:#0a0a0f;
      color:#fff;
      min-height:100vh;
    }

    header{
      position:sticky;
      top:0;
      z-index:100;
      background:#12121a;
      border-bottom:1px solid rgba(255,255,255,.06);
      padding:14px 20px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:15px;
      flex-wrap:wrap;
    }

    .logo{
      display:flex;
      align-items:center;
      gap:10px;
      font-weight:700;
      font-size:22px;
      color:#e8b86d;
    }

    .search{
      flex:1;
      max-width:420px;
      position:relative;
    }

    .search input{
      width:100%;
      padding:12px 16px 12px 42px;
      border:none;
      border-radius:12px;
      background:#1a1a25;
      color:#fff;
      outline:none;
      font-size:14px;
    }

    .search i{
      position:absolute;
      left:14px;
      top:50%;
      transform:translateY(-50%);
      color:#888;
    }

    .container{
      display:grid;
      grid-template-columns:260px 1fr;
      min-height:calc(100vh - 70px);
    }

    aside{
      background:#12121a;
      border-right:1px solid rgba(255,255,255,.06);
      padding:18px;
      overflow-y:auto;
    }

    aside h3{
      font-size:13px;
      color:#888;
      margin-bottom:12px;
      text-transform:uppercase;
      letter-spacing:1px;
    }

    .filter-btn{
      display:block;
      width:100%;
      text-align:left;
      padding:10px 12px;
      border:none;
      background:#1a1a25;
      color:#ddd;
      border-radius:10px;
      margin-bottom:8px;
      cursor:pointer;
      transition:.25s;
    }

    .filter-btn:hover,
    .filter-btn.active{
      background:#e8b86d;
      color:#111;
      font-weight:600;
    }

    main{
      padding:22px;
      overflow-y:auto;
    }

    .player{
      background:#12121a;
      border:1px solid rgba(255,255,255,.06);
      border-radius:18px;
      overflow:hidden;
      margin-bottom:26px;
    }

    .video-frame{
      width:100%;
      aspect-ratio:16/9;
      background:#000;
    }

    .video-frame iframe{
      width:100%;
      height:100%;
      border:none;
    }

    .placeholder{
      width:100%;
      height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      gap:12px;
      color:#888;
    }

    .player-info{
      padding:16px 20px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      flex-wrap:wrap;
      gap:10px;
    }

    .player-title{
      font-size:18px;
      font-weight:700;
    }

    .tags{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }

    .tag{
      background:#1a1a25;
      padding:6px 12px;
      border-radius:8px;
      font-size:12px;
      color:#ccc;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
      gap:18px;
    }

    .card{
      background:#12121a;
      border:1px solid rgba(255,255,255,.06);
      border-radius:16px;
      overflow:hidden;
      cursor:pointer;
      transition:.3s;
    }

    .card:hover{
      transform:translateY(-5px);
      border-color:#e8b86d;
    }

    .card-logo{
      aspect-ratio:16/10;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:26px;
      font-weight:700;
      color:#fff;
    }

    .card-body{padding:14px;}

    .card-title{
      font-size:14px;
      font-weight:600;
      margin-bottom:6px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .card-meta{
      font-size:12px;
      color:#888;
      display:flex;
      flex-direction:column;
      gap:4px;
    }

    .empty{
      text-align:center;
      padding:40px 20px;
      color:#888;
    }

    @media(max-width:900px){
      .container{grid-template-columns:1fr;}
      aside{border-right:none;border-bottom:1px solid rgba(255,255,255,.06);}
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <i class="fas fa-play-circle"></i>
    StreamFlow
  </div>

  <div class="search">
    <i class="fas fa-search"></i>
    <input type="text" id="searchInput" placeholder="Rechercher une chaîne, un pays ou une catégorie...">
  </div>
</header>

<div class="container">
  <aside>
    <h3>Pays</h3>
    <div id="countryFilters"></div>

    <h3 style="margin-top:20px;">Catégories</h3>
    <div id="categoryFilters"></div>
  </aside>

  <main>
    <div class="player">
      <div class="video-frame" id="videoFrame">
        <div class="placeholder">
          <i class="fas fa-tv" style="font-size:52px;color:#e8b86d;"></i>
          <h2>Sélectionnez une chaîne</h2>
          <p>Cliquez sur une chaîne dans la grille pour commencer le streaming.</p>
        </div>
      </div>

      <div class="player-info">
        <div class="player-title" id="playerTitle">Aucune chaîne sélectionnée</div>
        <div class="tags">
          <span class="tag" id="playerCountry">—</span>
          <span class="tag" id="playerCategory">—</span>
        </div>
      </div>
    </div>

    <h2 style="margin-bottom:18px;">Chaînes disponibles</h2>
    <div class="grid" id="channelGrid"></div>
  </main>
</div>

<script src="channels.js"></script>

<script>
let allChannels = [];
let currentCountry = 'all';
let currentCategory = 'all';
let currentSearch = '';

function hashColor(name){
  let hash = 0;
  for(let i=0;i<name.length;i++){
    hash = name.charCodeAt(i) + ((hash << 5) - hash);
  }
  return `hsl(${Math.abs(hash)%360},70%,45%)`;
}

function initials(name){
  return name
    .split(' ')
    .slice(0,2)
    .map(w=>w[0])
    .join('')
    .toUpperCase();
}

function loadData(){
  if(typeof CHANNELS_DATA !== 'undefined'){
    allChannels = CHANNELS_DATA.channels || [];
    renderFilters();
    renderChannels();
  } else {
    document.getElementById('channelGrid').innerHTML =
      '<div class="empty">channels.js introuvable</div>';
  }
}

function renderFilters(){
  const countries = [...new Set(allChannels.map(c=>c.country))].sort();
  const categories = [...new Set(allChannels.flatMap(c=>c.categories))].sort();

  const countryBox = document.getElementById('countryFilters');
  countryBox.innerHTML =
    `<button class="filter-btn ${currentCountry==='all'?'active':''}" onclick="setCountry('all')">Tous les pays</button>` +
    countries.map(c=>
      `<button class="filter-btn ${currentCountry===c?'active':''}" onclick="setCountry('${c}')">${c}</button>`
    ).join('');

  const catBox = document.getElementById('categoryFilters');
  catBox.innerHTML =
    `<button class="filter-btn ${currentCategory==='all'?'active':''}" onclick="setCategory('all')">Toutes les catégories</button>` +
    categories.map(c=>
      `<button class="filter-btn ${currentCategory===c?'active':''}" onclick="setCategory('${c}')">${c}</button>`
    ).join('');
}

window.setCountry = function(country){
  currentCountry = country;
  renderFilters();
  renderChannels();
}

window.setCategory = function(category){
  currentCategory = category;
  renderFilters();
  renderChannels();
}

function filteredChannels(){
  const search = currentSearch.toLowerCase();

  return allChannels.filter(ch=>{
    const matchCountry = currentCountry==='all' || ch.country===currentCountry;
    const matchCategory = currentCategory==='all' || ch.categories.includes(currentCategory);

    const matchSearch =
      !search ||
      ch.name.toLowerCase().includes(search) ||
      ch.country.toLowerCase().includes(search) ||
      ch.categories.some(cat=>cat.toLowerCase().includes(search));

    return matchCountry && matchCategory && matchSearch;
  });
}

function renderChannels(){
  const grid = document.getElementById('channelGrid');
  const channels = filteredChannels();

  if(channels.length===0){
    grid.innerHTML = '<div class="empty">Aucune chaîne trouvée</div>';
    return;
  }

  grid.innerHTML = channels.map(ch=>{
    const color = hashColor(ch.name);
    return `
      <div class="card" onclick="playChannel('${ch.id}')">
        <div class="card-logo" style="background:${color};">
          ${initials(ch.name)}
        </div>

        <div class="card-body">
          <div class="card-title">${ch.name}</div>
          <div class="card-meta">
            <span><i class="fas fa-flag"></i> ${ch.country}</span>
            <span><i class="fas fa-tag"></i> ${ch.categories[0]}</span>
          </div>
        </div>
      </div>`;
  }).join('');
}

window.playChannel = function(id){
  const ch = allChannels.find(c=>c.id===id);
  if(!ch) return;

  document.getElementById('videoFrame').innerHTML = `
    <iframe
      src="${ch.embed_url}"
      allowfullscreen
      allow="autoplay; fullscreen; picture-in-picture; encrypted-media"
      loading="eager">
    </iframe>`;

  document.getElementById('playerTitle').textContent = ch.name + ' • En direct';
  document.getElementById('playerCountry').textContent = ch.country;
  document.getElementById('playerCategory').textContent = ch.categories.join(', ');

  window.scrollTo({top:0,behavior:'smooth'});
}

document.getElementById('searchInput').addEventListener('input',e=>{
  currentSearch = e.target.value.trim();
  renderChannels();
} );

loadData();
</script>

</body>
</html>
